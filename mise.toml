[tools]
python = "3.13.11"

[tasks."proxy:start"]
description = "Start the Squid proxy container and wait for healthy"
run = """
docker compose up -d proxy
echo "Waiting for proxy health..."
until docker inspect agent-sandbox-proxy 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['State']['Health']['Status'])" 2>/dev/null | grep -q healthy; do
  sleep 1
done
echo "Proxy is healthy"
"""

[tasks."proxy:stop"]
description = "Stop the Squid proxy container"
run = "docker compose stop proxy"

[tasks."proxy:status"]
description = "Show proxy container status"
run = "docker compose ps proxy"

[tasks."proxy:logs"]
description = "Show Squid proxy logs"
usage = '''
flag "--follow -f" help="Follow log output (live tail)"
flag "--tail -n <lines>" help="Number of lines to show from end" default="100"
'''
run = """
ARGS="--tail ${usage_tail:-100}"
if [ "${usage_follow:-}" = "true" ]; then
  ARGS="$ARGS --follow"
fi
docker logs $ARGS agent-sandbox-proxy
"""

[tasks."sandbox:build"]
description = "Build sandbox container images"
run = "python3 images/build.py all"

[tasks."image:build"]
description = "Build sandbox container images (alias for sandbox:build)"
run = "python3 images/build.py all"

[tasks."sandbox:run"]
description = "Start a sandbox container instance"
usage = '''
flag "--name -n <name>" help="Sandbox instance name (defaults to workspace dir name)"
flag "--workspace -w <workspace>" help="Host workspace path to mount at /workspace" default="."
flag "--claude-config -c" help="Mount host ~/.claude readonly into container at /home/dev/.host-claude"
'''
run = """
WORKSPACE="${usage_workspace:-.}"
WORKSPACE="$(realpath "$WORKSPACE")"
# Default name to workspace directory basename if --name not provided
NAME="${usage_name:-$(basename "$WORKSPACE")}"

CLAUDE_MOUNT=""
if [ "${usage_claude_config:-}" = "true" ]; then
  HOST_CLAUDE="${HOME}/.claude"
  if [ -d "$HOST_CLAUDE" ]; then
    CLAUDE_MOUNT="--volume ${HOST_CLAUDE}:/home/dev/.host-claude:ro"
  else
    echo "Warning: ${HOST_CLAUDE} not found, skipping claude config mount"
  fi
fi

# Mount host git identity readonly if available
GIT_MOUNT=""
if [ -f "${HOME}/.gitconfig" ]; then
  GIT_MOUNT="--volume ${HOME}/.gitconfig:/home/dev/.gitconfig:ro"
elif [ -f "${XDG_CONFIG_HOME:-${HOME}/.config}/git/config" ]; then
  GIT_MOUNT="--volume ${XDG_CONFIG_HOME:-${HOME}/.config}/git/config:/home/dev/.gitconfig:ro"
fi

# Initialize named volumes with correct ownership (UID/GID 500 = dev user).
# Named volumes are created root-owned by Docker. The sandbox runs without CAP_CHOWN
# so the entrypoint cannot fix ownership at runtime. We use a short-lived init container
# (no security restrictions) to set ownership once. This is idempotent on restarts.
# For mise-state: copy the full directory tree from the image on first run so that
# cache/state subdirs already exist with correct ownership.
docker run --rm \
  --volume "npm-cache:/v/npm" \
  --volume "pip-cache:/v/pip" \
  --volume "go-cache:/v/go" \
  --volume "cargo-state:/v/cargo" \
  --volume "local-bin-state:/v/localbin" \
  --volume "command-history:/v/hist" \
  --volume "mise-state:/v/mise" \
  --entrypoint bash \
  agent-sandbox-claude:local \
  -c "if [ ! -f /v/mise/.initialized ]; then cp -a /home/dev/.mise/. /v/mise/ && touch /v/mise/.initialized; fi && mkdir -p /v/npm /v/pip /v/go /v/cargo/bin /v/localbin /v/hist && chown -R 1000:1000 /v/npm /v/pip /v/go /v/cargo /v/localbin /v/hist /v/mise"

# Resolve proxy container IP — compose DNS aliases aren't visible to standalone docker run
PROXY_IP=$(docker inspect agent-sandbox-proxy --format json 2>/dev/null \
  | python3 -c "import sys,json; nets=json.load(sys.stdin)[0]['NetworkSettings']['Networks']; print(next(v['IPAddress'] for k,v in nets.items() if 'internal' in k))" 2>/dev/null)
if [ -z "$PROXY_IP" ]; then
  echo "ERROR: proxy container not running. Start it with: mise run proxy:start"
  exit 1
fi

docker run -d -i \
  --name "agent-sandbox-${NAME}" \
  --network agent-sandbox_sandbox-internal \
  --add-host proxy:${PROXY_IP} \
  --cap-drop ALL \
  --cap-add SETUID \
  --cap-add SETGID \
  --security-opt no-new-privileges:true \
  --read-only \
  --tmpfs /tmp:size=268435456 \
  --tmpfs /run:size=67108864 \
  --tmpfs /home/dev/.cache:size=67108864,uid=1000,gid=1000,exec \
  --cpus "${SANDBOX_CPUS:-2}" \
  --memory "${SANDBOX_MEMORY:-4g}" \
  --pids-limit "${SANDBOX_PIDS:-512}" \
  --volume "${WORKSPACE}:/workspace" \
  --volume "claude-state:/home/dev/.claude" \
  --volume "command-history:/commandhistory" \
  --volume "mise-state:/home/dev/.mise" \
  --volume "cargo-state:/home/dev/.cargo" \
  --volume "local-bin-state:/home/dev/.local/bin" \
  --volume "npm-cache:/home/dev/.npm" \
  --volume "pip-cache:/home/dev/.cache/pip" \
  --volume "go-cache:/home/dev/go/pkg/mod" \
  ${CLAUDE_MOUNT} \
  ${GIT_MOUNT} \
  --env TZ="${TZ:-Europe/Stockholm}" \
  --env CLAUDE_CONFIG_DIR=/home/dev/.claude \
  --env EDITOR=nvim \
  --env VISUAL=nvim \
  --env MISE_TRUSTED_CONFIG_PATHS=/workspace \
  --env HTTP_PROXY=http://proxy:3128 \
  --env HTTPS_PROXY=http://proxy:3128 \
  --env http_proxy=http://proxy:3128 \
  --env https_proxy=http://proxy:3128 \
  --env NO_PROXY=localhost,127.0.0.1 \
  --env no_proxy=localhost,127.0.0.1 \
  --env GOPROXY=https://proxy.golang.org,direct \
  --env CARGO_HTTP_PROXY=http://proxy:3128 \
  --workdir /workspace \
  agent-sandbox-claude:local
echo "Sandbox agent-sandbox-${NAME} started (workspace: ${WORKSPACE})"
"""

[tasks."sandbox:logs"]
description = "Show sandbox container logs"
usage = '''
flag "--name -n <name>" help="Sandbox instance name" default="default"
flag "--follow -f" help="Follow log output (live tail)"
flag "--tail -t <lines>" help="Number of lines to show from end" default="100"
'''
run = """
NAME="${usage_name:-default}"
ARGS="--tail ${usage_tail:-100}"
if [ "${usage_follow:-}" = "true" ]; then
  ARGS="$ARGS --follow"
fi
docker logs $ARGS "agent-sandbox-${NAME}"
"""

[tasks."sandbox:stop"]
description = "Stop and remove a named sandbox container (shows filesystem and workspace diffs)"
usage = '''
flag "--name -n <name>" help="Sandbox instance name to stop" default="default"
'''
run = """
NAME="${usage_name:-default}"
CONTAINER="agent-sandbox-${NAME}"

echo ""
echo "=== Container filesystem changes ==="
echo "(A=Added, C=Changed, D=Deleted)"
docker diff "${CONTAINER}" 2>/dev/null || echo "(no changes or container not found)"

echo ""
echo "=== Workspace changes ==="
WORKSPACE=$(docker inspect "${CONTAINER}" --format json 2>/dev/null \
  | python3 -c "import sys,json; m=json.load(sys.stdin)[0]['Mounts']; print(next((x['Source'] for x in m if x['Destination']=='/workspace'),''))" 2>/dev/null || echo "")
if [ -n "$WORKSPACE" ] && [ -d "$WORKSPACE" ]; then
  git -C "$WORKSPACE" diff --stat 2>/dev/null || echo "(workspace is not a git repo or no changes)"
else
  echo "(could not determine workspace path)"
fi

echo ""
docker stop "${CONTAINER}"
docker rm "${CONTAINER}"
echo "Sandbox ${CONTAINER} stopped"
"""

[tasks."sandbox:attach"]
description = "Attach to a running sandbox container"
usage = '''
arg "<name>" help="Sandbox instance name (e.g. cognex)"
'''
run = """
docker exec -it -u dev "agent-sandbox-${usage_name}" zsh
"""
