# Docker Compose for agent-sandbox
# Requires: python3 images/build.py proxy && python3 images/build.py all

services:
  proxy:
    image: agent-sandbox-proxy:local
    container_name: agent-sandbox-proxy
    networks:
      - sandbox-internal
      - sandbox-external
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 3 -x http://localhost:3128 http://mise-versions.jdx.dev"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      # Host-mount overrides the baked-in allowlist — edit config/allowlist.txt to add domains
      # without rebuilding the proxy image. Comment out to use the baked-in default.
      - ./config/allowlist.txt:/etc/squid/allowlist.txt:ro
    # Do NOT add ports: here — port 3128 is only accessible within Docker networks

  agent-sandbox:
    image: agent-sandbox-claude:local
    container_name: agent-sandbox
    networks:
      - sandbox-internal
    depends_on:
      proxy:
        condition: service_healthy
    read_only: true
    # Drop all capabilities; add back only what the root entrypoint needs to drop privileges to dev user
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${SANDBOX_CPUS:-2}'
          memory: ${SANDBOX_MEMORY:-4g}
          pids: ${SANDBOX_PIDS:-512}
    volumes:
      # Your project workspace
      - .:/workspace
      # Persist Claude credentials
      - claude-state:/home/dev/.claude
      # Persist shell history
      - command-history:/commandhistory
      # Persist .cache files (mise)
      - mise-state:/home/dev/.mise
      - cargo-state:/home/dev/.cargo
      - local-bin-state:/home/dev/.local/bin
      # Package manager caches — persist downloaded packages across sandbox restarts
      - npm-cache:/home/dev/.npm
      - pip-cache:/home/dev/.cache/pip
      - go-cache:/home/dev/go/pkg/mod
      # Host Claude config (optional - uncomment to share host config readonly)
      # - ${HOME}/.claude:/home/dev/.host-claude:ro
      # Writable tmpfs mounts required under read_only: true
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 268435456    # 256MB in bytes
      - type: tmpfs
        target: /run
        tmpfs:
          size: 67108864     # 64MB in bytes
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - CLAUDE_CONFIG_DIR=/home/dev/.claude
      - POWERLEVEL9K_DISABLE_GITSTATUS=true
      # Proxy routing — both uppercase and lowercase for broad tool compatibility
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - http_proxy=http://proxy:3128
      - https_proxy=http://proxy:3128
      # Exclude loopback from proxy routing
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
      # Go module proxy — controls where go get fetches modules from
      - GOPROXY=https://proxy.golang.org,direct
      # Cargo proxy fallback env var — bypasses volume-shadowed config.toml
      - CARGO_HTTP_PROXY=http://proxy:3128

networks:
  sandbox-internal:
    # internal: true means Docker blocks all external routing from this network
    # Sandbox containers can only reach the internet via the proxy container
    internal: true
  sandbox-external:
    driver: bridge

volumes:
  claude-state:
  command-history:
  mise-state:
  cargo-state:
  local-bin-state:
  npm-cache:
  pip-cache:
  go-cache:
